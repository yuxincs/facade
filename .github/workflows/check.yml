name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, vet, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Read golangci-lint version
        id: golangci-version
        run: echo "version=$(cat .golangciversion)" >> "$GITHUB_OUTPUT"

      # Use the action for installation and caching; Make runs the actual checks.
      - name: Install golangci-lint and restore cache
        uses: golangci/golangci-lint-action@v9
        with:
          version: v${{ steps.golangci-version.outputs.version }}
          args: -h

      - name: Link golangci-lint for Make
        run: mkdir -p bin && ln -s "$(command -v golangci-lint)" bin/golangci-lint

      - name: Check formatting and lint
        run: make format-lint lint

      - name: Vet
        run: go vet ./...

      - name: Test and collect coverage
        run: make cover

      - name: Build static executable
        run: make build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
